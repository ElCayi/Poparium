[project]
name = "popos"
version = "0.1.0"
description = "popOS · Personal Operating System: libreta de acuerdos para tmux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # only the standard library (curses, sqlite3)

[project.scripts]
popos = "popos.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["popos*"]

[tool.setuptools.package-data]
popos = ["assets/*.json"]
