[package]
name = "poparium"
version = "0.1.0"
description = "Poparium · Memoria entre sesiones: libreta de acuerdos para tmux"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
miniz_oxide = "0.9.1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
unicode-width = "0.2.3"

[profile.release]
# Small and quick to start on modest machines: one codegen unit, LTO, no symbols
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
